services:
  db:
    image: postgres:16-alpine
    container_name: travellab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: travellab
      POSTGRES_USER: travellab
      POSTGRES_PASSWORD: travellab
    ports:
      - "5432:5432"
    volumes:
      - travellab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travellab -d travellab"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: travellab_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  travellab_pgdata:
